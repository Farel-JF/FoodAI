<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panier - FoodAI</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>

    <!-- Header -->
    <header>
        <div class="container">
            <h1><a href="{{ url_for('home') }}">FoodAI</a></h1>
            <p>Nutrition Meets Technology for Your Fitness Success</p>
            <nav>
                <ul>
                    <li><a href="{{ url_for('home') }}">Produits</a></li>
                    <li><a href="{{ url_for('ai_helper') }}">AI Helper</a></li>
                    <li><a href="{{ url_for('home') }}">À Propos</a></li>
                    <li><a href="{{ url_for('contact') }}">Contact</a></li>
                </ul>
            </nav>
            <div class="login-container">
                <a id="login-btn" href="{{ url_for('login') }}" class="btn">Login</a>
            </div>
        </div>
    </header>

    <!-- Cart Section -->
    <section id="cart" class="container">
        <h2>Votre Panier</h2>

        <!-- Cart Items List -->
        <div class="cart-items"></div>

        <!-- Total Price and Payment Button -->
        <h3>Total : €<span id="total-price">0.00</span></h3>
        <a href="{{ url_for('payment') }}" class="btn">Passer au Paiement</a>
    </section>

    <!-- Footer -->
    <footer class="container">
        <p>&copy; 2024 FoodAI. Tous droits réservés.</p>
    </footer>

    <script>
        // Function to load cart items and calculate the total price
        function loadCart() {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const cartItemsContainer = document.querySelector('.cart-items');
            cartItemsContainer.innerHTML = '';  // Clear existing items to avoid duplicates
            let totalPrice = 0;

            cart.forEach(item => {
                const cartItem = document.createElement('div');
                cartItem.classList.add('cart-item');
                cartItem.dataset.product = item.product;

                cartItem.innerHTML = `
                    <img src="https://via.placeholder.com/100" alt="${item.product}">
                    <div class="item-details">
                        <h3>${item.product}</h3>
                        <p>Quantité : ${item.quantity}</p>
                        <p>Prix : €<span class="item-price">${(item.price * item.quantity).toFixed(2)}</span></p>
                    </div>
                    <button class="remove-btn" onclick="removeItem('${item.product}', ${item.price * item.quantity})">Retirer</button>
                `;
                cartItemsContainer.appendChild(cartItem);
                totalPrice += item.price * item.quantity;
            });

            // Update the total price
            document.getElementById('total-price').textContent = totalPrice.toFixed(2);
        }

        // Call loadCart on page load
        window.onload = loadCart;

        // Function to remove an item from the cart
        function removeItem(product, itemPrice) {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            cart = cart.filter(item => item.product !== product);
            localStorage.setItem('cart', JSON.stringify(cart));

            // Remove item from the DOM
            const itemToRemove = document.querySelector(`.cart-item[data-product="${product}"]`);
            if (itemToRemove) {
                itemToRemove.remove();
            }

            // Update the total price
            const currentTotal = parseFloat(document.getElementById('total-price').textContent);
            const newTotal = (currentTotal - itemPrice).toFixed(2);
            document.getElementById('total-price').textContent = newTotal;
        }
    </script>

</body>
</html>
