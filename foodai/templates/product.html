<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>{{ product.name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}"> <!-- Example for CSS -->
</head>
<body>
    <h1>{{ product.name }}</h1>
    <img src="{{ product.image_url }}" alt="{{ product.name }}">
    <p>Description: {{ product.description }}</p>
    <p>Price: €{{ product.price }}</p>
    <p>Stock Quantity: {{ product.stock_quantity }}</p>

    <form action="{{ url_for('add_to_cart') }}" method="POST">
        <input type="hidden" name="product" value="{{ product.name }}">
        <input type="hidden" name="price" value="{{ product.price }}">
        <label for="quantity">Quantity:</label>
        <input type="number" name="quantity" id="quantity" min="1" max="{{ product.stock_quantity }}" required>
        <button type="submit">Add to Cart</button>
    </form>
    <a href="{{ url_for('home') }}">Back to Home</a> <!-- Example navigation -->
</body>
</html>
